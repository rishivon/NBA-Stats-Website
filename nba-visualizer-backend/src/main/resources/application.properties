spring.application.name=nba-visualizer-backend

# Supabase/PostgreSQL can be enabled by setting DATABASE_URL, DATABASE_USERNAME,
# and DATABASE_PASSWORD. The H2 fallback keeps local development and tests runnable.
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/nba_visualizer;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=750ms
spring.data.redis.repositories.enabled=false

nba.proxy.base-url=${NBA_PROXY_BASE_URL:http://localhost:8000}
nba.cache.standings-ttl-seconds=${NBA_CACHE_STANDINGS_TTL_SECONDS:600}
nba.cache.teams-ttl-seconds=${NBA_CACHE_TEAMS_TTL_SECONDS:2592000}
nba.refresh.standings-stale-minutes=${NBA_REFRESH_STANDINGS_STALE_MINUTES:20}
nba.refresh.metadata-stale-days=${NBA_REFRESH_METADATA_STALE_DAYS:30}
nba.refresh.jitter-min-seconds=${NBA_REFRESH_JITTER_MIN_SECONDS:1}
nba.refresh.jitter-max-seconds=${NBA_REFRESH_JITTER_MAX_SECONDS:60}
